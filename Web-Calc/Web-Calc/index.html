<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech&display=swap" rel="stylesheet">
    <title>Calculadora Virtual</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <h1>Calculadora Simples</h1>
    </header>

    <main id="Calculadora">
        <section id="Tela">
            <div id="historico"></div>
            <output id="visor">20+20+20+7</output>
        </section>

        <section id="Teclado">
            <button class="operador" value="(">(</button>
            <button class="operador" value=")">)</button>
            <button class="operador" value="[">[</button>
            <button class="operador" value="]">]</button>
            <button class="operador" value="/">÷</button>

            <button class="numerador" value="7">7</button>
            <button class="numerador" value="8">8</button>
            <button class="numerador" value="9">9</button>
            <button class="operador" value="%">%</button>
            <button class="operador" value="*">×</button>

            <button class="numerador" value="4">4</button>
            <button class="numerador" value="5">5</button>
            <button class="numerador" value="6">6</button>
            <button class="operador" value="√">√</button>
            <button class="operador" value="-">−</button>

            <button class="numerador" value="1">1</button>
            <button class="numerador" value="2">2</button>
            <button class="numerador" value="3">3</button>
            <button class="operador" value="^">xⁿ</button>
            <button class="operador" value="+">+</button>

            <button id="zero" value="0">0</button>
            <button id="btn-clear">C</button>
            <button id="btn-igual">=</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
